name: Sync LiteLLM Pricing

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-pricing:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync pricing data
        run: npm run sync:pricing

      - name: Validate build
        run: npm run build

      - name: Commit pricing changes
        run: |
          if git diff --quiet -- src/lib/data/modelsPricing.ts; then
            echo "No pricing changes to commit."
            exit 0
          fi
          git add src/lib/data/modelsPricing.ts
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: sync LiteLLM pricing data"
          git push
